# Musique: build the debug APK on GitHub Actions.
#
# The Gradle build cannot run in the agent sandbox (the sandbox blocks
# the Gradle daemon's loopback TCP), so CI is the build machine:
# every push to main, and every manual run, compiles the debug APK
# and uploads it as a build artifact. Download it from the Actions
# run page and install it with: adb install -r app-debug.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

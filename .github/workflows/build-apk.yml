# Musique: build the debug APK on GitHub Actions.
#
# The Gradle build cannot run in the agent sandbox (the sandbox blocks
# the Gradle daemon's loopback TCP), so CI is the build machine:
# every push to main, and every manual run, compiles the debug APK
# and keeps it as a run artifact (30 days). Only a v* tag publishes
# a release: pushing a version tag creates the versioned release
# with musique.apk attached. There is no rolling dev release.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Publishing a release needs write access to the repo contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: the release step lists the commits
          # since the previous tag for the release notes.
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their executable
      # bit, so gradlew arrives non-executable and CI fails with
      # "Permission denied" (run #1). Make it executable first.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The persistent signing key lives only in repo secrets
      # (KEYSTORE_BASE64): decode it to a temp file the runner
      # discards with the job, and point the build at it. The
      # keystore and its password are never in the repo, which is
      # public.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/musique.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/musique.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleDebug --stacktrace

      # The delivered file is musique.apk everywhere.
      # Gradle still writes its own output name under
      # app/build/outputs/apk/debug/; only the delivered copy is renamed.
      - name: Rename APK to musique.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk musique.apk

      - name: Upload musique APK
        uses: actions/upload-artifact@v4
        with:
          name: musique
          path: musique.apk
          retention-days: 30

      # Versioned releases: pushing a v* tag publishes a release for
      # that tag. The notes are a plain list of the commit subjects
      # since the previous tag: just what changed, no author
      # mentions and no contributors section (the generated-notes
      # default tags the account, which is not wanted). version.json
      # rides along so the in-app update check can compare
      # versionCodes: it carries this run's number, the same number
      # Gradle baked into the APK as versionCode, plus the tag name
      # for the update dialog.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"versionCode": %s, "tag": "%s"}' "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > version.json
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi
          git log "$RANGE" --pretty=format:"- %s" --reverse > changes.txt
          # A re-pushed tag reuses its release name: delete any
          # existing release for this tag first, so the create
          # below replaces it instead of failing. Fresh tags have
          # no release yet, so a missing release is fine.
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" --title "Musique $GITHUB_REF_NAME" --notes-file changes.txt musique.apk version.json
